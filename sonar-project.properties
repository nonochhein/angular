sonar.host.url=https://sonarcloud.io
sonar.projectKey=nonochhein_angular
sonar.organization=nonochhein

# Framework sources only. Angular tests are named *_spec.ts and the compiler
# compliance test_cases are golden files that are not valid JavaScript.
sonar.sources=packages
sonar.exclusions=**/node_modules/**,**/*.d.ts,**/dist/**,**/bazel-*/**,**/test/**,**/*_spec.ts,**/*.spec.ts,**/test_cases/**,**/golden*/**

# Use a single tsconfig instead of the 78 discovered across the repository,
# and give the analyzer enough heap for the remaining sources.
sonar.typescript.tsconfigPaths=packages/tsconfig.json
sonar.javascript.node.maxspace=8192

sonar.sourceEncoding=UTF-8
